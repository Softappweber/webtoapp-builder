<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebToApp Builder — Final Edition</title>
<!-- Include JSZip library -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f0f4f8; color: #1e293b; padding: 40px 20px; }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 2.2rem; text-align: center; margin-bottom: 10px; color: #0f172a; }
  .sub { text-align: center; color: #64748b; margin-bottom: 30px; }
  .card { background: #fff; border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); padding: 24px; margin-bottom: 20px; position: relative; }
  .card h2 { font-size: 1.1rem; margin-bottom: 15px; border-bottom: 2px solid #e2e8f0; padding-bottom: 10px; color: #334155; }
  
  .reset-btn { position: absolute; top: 20px; right: 20px; background: #ef4444; color: white; border: none; padding: 8px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.8rem; transition: 0.2s; box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3); }
  .reset-btn:hover { background: #dc2626; }
  .reset-btn:active { transform: scale(0.95); }

  label { display: block; font-size: 0.85rem; font-weight: 600; color: #475569; margin: 12px 0 6px; }
  input[type=text], input[type=url], textarea, select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-family: inherit; font-size: 0.95rem; background: #f8fafc; transition: border 0.2s; }
  input:focus, textarea:focus { outline: none; border-color: #3b82f6; background: #fff; }
  textarea { min-height: 150px; font-family: monospace; font-size: 0.85rem; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .three-col { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
  
  .mode-tabs { display: flex; gap: 10px; margin-bottom: 20px; background: #e2e8f0; padding: 6px; border-radius: 10px; }
  .mode-tabs button { flex: 1; padding: 12px; border: none; background: transparent; border-radius: 8px; cursor: pointer; font-weight: 600; color: #64748b; transition: 0.2s; }
  .mode-tabs button.active { background: #fff; color: #3b82f6; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
  .mode-panel { display: none; }
  .mode-panel.active { display: block; }
  
  #buildBtn { width: 100%; padding: 18px; background: #10b981; color: #fff; border: none; border-radius: 10px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; transition: 0.2s; box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
  #buildBtn:hover { background: #059669; }
  
  input[type=file] { padding: 8px; background: #f8fafc; border: 1px solid #cbd5e1; border-radius: 8px; width: 100%; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Final Builder</h1>
  <p class="sub">Zero gradle errors. No cache ghosting.</p>

  <div class="card">
    <button class="reset-btn" onclick="resetForm()">🔄 Reset Form</button>
    <h2>1. App Content</h2>
    <div class="mode-tabs">
      <button class="active" data-mode="html">Paste HTML</button>
      <button data-mode="zip">Upload ZIP (Multi-file)</button>
      <button data-mode="url">Website URL</button>
    </div>
    
    <div class="mode-panel active" id="panelHtml">
      <label>Paste your full HTML/CSS/JS</label>
      <textarea id="htmlContent" placeholder="Paste your complete HTML code here..."></textarea>
    </div>
    
    <div class="mode-panel" id="panelZip">
      <label>Upload Website .ZIP File (must contain index.html at root)</label>
      <input type="file" id="zipFile" accept=".zip">
      <p style="font-size: 0.8rem; color: #64748b; margin-top: 8px;">Do not rename files. The builder extracts folders perfectly.</p>
    </div>
    
    <div class="mode-panel" id="panelUrl">
      <label>Website URL</label>
      <input type="url" id="siteUrl" value="https://example.com">
    </div>
  </div>

  <div class="card">
    <h2>2. App Identity</h2>
    <div class="two-col">
      <div>
        <label>App Name</label>
        <input type="text" id="appName" value="My App">
      </div>
      <div>
        <label>Package ID (Unique)</label>
        <input type="text" id="pkgName" value="com.solodsapps.app">
      </div>
    </div>
    
    <label>App Icon (PNG/JPG)</label>
    <input type="file" id="iconFile" accept="image/png, image/jpeg">
  </div>

  <div class="card">
    <h2>3. App Behavior</h2>
    <div class="three-col">
      <div>
        <label>Orientation</label>
        <select id="orientation">
          <option value="portrait">Portrait Only</option>
          <option value="unspecified">Auto Rotate</option>
        </select>
      </div>
      <div>
        <label>Fullscreen</label>
        <select id="fullscreen">
          <option value="false">Show Status Bar</option>
          <option value="true">Hide Status Bar</option>
        </select>
      </div>
      <div>
        <label>Internet Access</label>
        <select id="internetPerm">
          <option value="false">Offline Only</option>
          <option value="true">Required</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>4. Generate</h2>
    <button id="buildBtn">Download Android Project ZIP</button>
  </div>
</div>

<script>
(function() {
  let mode = 'html';
  
  // TABS
  document.querySelectorAll('.mode-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(mode === 'url' ? 'panelUrl' : mode === 'zip' ? 'panelZip' : 'panelHtml').classList.add('active');
    });
  });

  // RESET BUTTON
  window.resetForm = function() {
    document.getElementById('htmlContent').value = '';
    document.getElementById('zipFile').value = '';
    document.getElementById('siteUrl').value = 'https://example.com';
    document.getElementById('appName').value = 'My App';
    document.getElementById('iconFile').value = '';
    
    // Generate a random 4-char suffix to bypass Android cache
    const randomSuffix = Math.random().toString(36).substring(2, 6);
    document.getElementById('pkgName').value = `com.solodsapps.app.${randomSuffix}`;
    
    alert("Form Reset! Package ID randomized to prevent cache issues.");
  };

  function crc32(bytes) {
    let c, crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      c = (crc ^ bytes[i]) & 0xFF;
      for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1;
      crc = (crc >>> 8) ^ c;
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function makeZip(files) {
    const encoder = new TextEncoder();
    const chunks = [];
    const central = [];
    let offset = 0;

    files.forEach(f => {
      const nameBytes = encoder.encode(f.name);
      const crc = crc32(f.data);
      const size = f.data.length;

      const local = new Uint8Array(30 + nameBytes.length);
      const dv = new DataView(local.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0, true);
      dv.setUint16(8, 0, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, size, true);
      dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true);
      local.set(nameBytes, 30);
      chunks.push(local, f.data);

      const cen = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      cen.set(nameBytes, 46);
      central.push(cen);
      offset += local.length + size;
    });

    const centralSize = central.reduce((a, b) => a + b.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);

    return new Blob([...chunks, ...central, end], { type: 'application/zip' });
  }

  // THE GRADLEW SCRIPT (Embedded safely)
  const gradlewScript = `#!/bin/sh
app_path=$0
while [ -h "$app_path" ]; do ls=$( ls -ld "$app_path" ); link=\${ls#*' -> '}; case $link in /*) app_path=$link ;; *) app_path=$APP_HOME$link ;; esac; done
APP_HOME=$( cd "\${APP_HOME:-./}" && pwd -P ) || exit
APP_BASE_NAME=\${0##*/}
CLASSPATH=$APP_HOME/gradle/wrapper/gradle-wrapper.jar
if [ -n "$JAVA_HOME" ] ; then JAVACMD=$JAVA_HOME/bin/java; else JAVACMD=java; fi
DEFAULT_JVM_OPTS='"-Xmx64m" "-Xms64m"'
set -- "-Dorg.gradle.appname=$APP_BASE_NAME" -classpath "$CLASSPATH" org.gradle.wrapper.GradleWrapperMain "$@"
eval "set -- $( printf '%s\\\\n' "$DEFAULT_JVM_OPTS $JAVA_OPTS $GRADLE_OPTS" | xargs -n1 | sed ' s~[^-[:alnum:]+,./:=@_]~\\\\&~g; ' | tr '\\\\n' ' ' )" '"$@"'
exec "$JAVACMD" "$@"`;

  document.getElementById('buildBtn').addEventListener('click', async () => {
    try {
      const name = document.getElementById('appName').value.trim() || 'My App';
      const pkg = document.getElementById('pkgName').value.trim() || 'com.solodsapps.app';
      const orientation = document.getElementById('orientation').value;
      const isFullscreen = document.getElementById('fullscreen').value;
      const needsInternet = document.getElementById('internetPerm').value;

      const iconFileInput = document.getElementById('iconFile');
      let iconBytes = null;
      if (iconFileInput.files.length > 0) {
        iconBytes = new Uint8Array(await iconFileInput.files[0].arrayBuffer());
      }

      const encoder = new TextEncoder();
      const files = [];
      const add = (path, content) => files.push({ name: path, data: encoder.encode(content) });
      const addBinary = (path, data) => files.push({ name: path, data: data });

      // 1. WORKFLOW (Fixed to use the embedded wrapper)
      add('.github/workflows/build.yml', `name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v4.0.4
      - name: Build
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
`);

      // 2. GRADLE WRAPPER + SCRIPT (Embedded)
      add('android/gradlew', gradlewScript);
      add('android/gradle/wrapper/gradle-wrapper.properties', `distributionBase=GRADLE_USER_HOME\ndistributionPath=wrapper/dists\ndistributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip\nzipStoreBase=GRADLE_USER_HOME\nzipStorePath=wrapper/dists\n`);

      // 3. SETTINGS.GRADLE (Modern pluginManagement)
      add('android/settings.gradle', `pluginManagement {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    plugins { id 'com.android.application' version '8.2.0' }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories { google(); mavenCentral() }
}
rootProject.name = "${name.replace(/[^a-zA-Z0-9]/g, '')}"
include ':app'
`);

      // 4. ROOT BUILD.GRADLE (Cleaned up)
      add('android/build.gradle', `// Dependencies are managed in settings.gradle and app/build.gradle\n`);

      // 5. GRADLE.PROPERTIES
      add('android/gradle.properties', `android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n`);

      // 6. APP BUILD.GRADLE
      const versionCode = Math.floor(Date.now() / 1000);
      add('android/app/build.gradle', `plugins { id 'com.android.application' }
android {
    namespace '${pkg}'
    compileSdk 34
    defaultConfig {
        applicationId "${pkg}"
        minSdk 21
        targetSdk 34
        versionCode ${versionCode}
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
`);

      // 7. ANDROID MANIFEST
      const iconString = iconBytes ? "@drawable/custom_icon" : "@mipmap/ic_launcher";
      const internetTag = needsInternet === 'true' ? `<uses-permission android:name="android.permission.INTERNET"/>` : '';
      add('android/app/src/main/AndroidManifest.xml', `<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    ${internetTag}
    <application android:label="${name}" android:theme="@style/AppTheme" android:usesCleartextTraffic="true" android:icon="${iconString}">
        <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="${orientation}">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
    </application>
</manifest>
`);

      // 8. STYLES
      add('android/app/src/main/res/values/styles.xml', `<?xml version="1.0" encoding="utf-8"?>
<resources><style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar"><item name="android:windowBackground">#ffffff</item></style></resources>
`);

      // 9. MAIN ACTIVITY
      const loadLine = mode === 'url' 
        ? `webView.loadUrl("${document.getElementById('siteUrl').value}");`
        : `webView.loadUrl("file:///android_asset/index.html");`;
      
      const fullscreenLogic = isFullscreen === 'true' 
        ? `getWindow().setFlags(android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN, android.view.WindowManager.LayoutParams.FLAG_FULLSCREEN);`
        : '';

      add('android/app/src/main/java/' + pkg.replace(/\./g, '/') + '/MainActivity.java', `package ${pkg};
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;
import android.annotation.SuppressLint;

public class MainActivity extends AppCompatActivity {
    private WebView webView;
    @SuppressLint("SetJavaScriptEnabled")
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        ${fullscreenLogic}
        webView = new WebView(this);
        setContentView(webView);
        WebSettings s = webView.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setMediaPlaybackRequiresUserGesture(false);
        s.setAllowFileAccess(true);
        s.setAllowContentAccess(true);
        webView.setWebViewClient(new WebViewClient());
        ${loadLine}
    }
    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }
}
`);

      // 10. CONTENT HANDLING (HTML vs ZIP)
      if (mode === 'html') {
        const htmlCode = document.getElementById('htmlContent').value.trim();
        if (!htmlCode) return alert("❌ Please paste HTML code.");
        add('android/app/src/main/assets/index.html', htmlCode);
      } else if (mode === 'zip') {
        const zipInput = document.getElementById('zipFile');
        if (zipInput.files.length === 0) return alert("❌ Please upload a ZIP file.");
        
        const zip = new JSZip();
        const loadedZip = await zip.loadAsync(zipInput.files[0]);
        
        let hasIndex = false;
        for (const [relativePath, zipEntry] of Object.entries(loadedZip.files)) {
          if (!zipEntry.dir) {
            if (relativePath === 'index.html') hasIndex = true;
            const content = await zipEntry.async("uint8array");
            addBinary('android/app/src/main/assets/' + relativePath, content);
          }
        }
        if (!hasIndex) alert("⚠️ Warning: 'index.html' was not found at the root of your ZIP. The app might show a blank screen.");
      }

      // 11. CUSTOM ICON
      if (iconBytes) addBinary('android/app/src/main/res/drawable/custom_icon.png', iconBytes);

      // 12. README
      add('README.md', `# ${name}\nBuilt via WebToApp Builder.`);

      const blob = makeZip(files);
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'android-project.zip';
      a.click();
    } catch (err) {
      alert("Error: " + err.message);
    }
  });
})();
</script>
</body>
</html>
