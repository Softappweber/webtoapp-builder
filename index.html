<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebToApp Builder — GitHub Edition (Fixed)</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; color: #2d3748; padding: 40px 20px; }
  .wrap { max-width: 800px; margin: 0 auto; }
  h1 { font-size: 2rem; text-align: center; margin-bottom: 10px; color: #2b6cb0; }
  .sub { text-align: center; color: #718096; margin-bottom: 30px; }
  .card { background: #fff; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); padding: 24px; margin-bottom: 20px; }
  .card h2 { font-size: 1.1rem; margin-bottom: 15px; border-bottom: 2px solid #edf2f7; padding-bottom: 10px; }
  label { display: block; font-size: 0.85rem; font-weight: 600; color: #4a5568; margin: 12px 0 6px; }
  input[type=text], input[type=url], textarea { width: 100%; padding: 10px; border: 1px solid #cbd5e0; border-radius: 6px; font-family: inherit; }
  textarea { min-height: 100px; font-family: monospace; font-size: 0.85rem; }
  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
  .mode-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
  .mode-tabs button { flex: 1; padding: 10px; border: 1px solid #cbd5e0; background: #edf2f7; border-radius: 6px; cursor: pointer; font-weight: 600; }
  .mode-tabs button.active { background: #2b6cb0; color: #fff; border-color: #2b6cb0; }
  .mode-panel { display: none; }
  .mode-panel.active { display: block; }
  #buildBtn { width: 100%; padding: 15px; background: #38a169; color: #fff; border: none; border-radius: 8px; font-size: 1.1rem; font-weight: bold; cursor: pointer; margin-top: 10px; }
  #buildBtn:hover { background: #2f855a; }
  .note { background: #ebf8ff; color: #2b6cb0; padding: 12px; border-radius: 6px; font-size: 0.85rem; margin-top: 15px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>WebToApp Builder (Fixed)</h1>
  <p class="sub">Generates a complete, GitHub-ready Android project.</p>

  <div class="card">
    <h2>1. App Content</h2>
    <div class="mode-tabs">
      <button class="active" data-mode="url">Website URL</button>
      <button data-mode="html">Paste HTML</button>
    </div>
    <div class="mode-panel active" id="panelUrl">
      <label>Website URL</label>
      <input type="url" id="siteUrl" value="https://example.com">
    </div>
    <div class="mode-panel" id="panelHtml">
      <label>HTML Content (Offline)</label>
      <textarea id="htmlContent" placeholder="<!DOCTYPE html>..."></textarea>
    </div>
  </div>

  <div class="card">
    <h2>2. App Details</h2>
    <div class="two-col">
      <div>
        <label>App Name</label>
        <input type="text" id="appName" value="My App">
      </div>
      <div>
        <label>Package ID</label>
        <input type="text" id="pkgName" value="com.example.myapp">
      </div>
    </div>
  </div>

  <div class="card">
    <h2>3. Generate</h2>
    <button id="buildBtn">Download Project ZIP</button>
    <div class="note">
      <strong>Instructions:</strong><br>
      1. Unzip the downloaded file.<br>
      2. Create a new empty repo on GitHub.<br>
      3. Upload the files.<br>
      4. The APK will build automatically in the Actions tab.
    </div>
  </div>
</div>

<script>
(function() {
  let mode = 'url';
  
  // Tab logic
  document.querySelectorAll('.mode-tabs button').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-tabs button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      mode = btn.dataset.mode;
      document.querySelectorAll('.mode-panel').forEach(p => p.classList.remove('active'));
      document.getElementById(mode === 'url' ? 'panelUrl' : 'panelHtml').classList.add('active');
    });
  });

  // ZIP Generator (Pure JS)
  function crc32(bytes) {
    let c, crc = 0xFFFFFFFF;
    for (let i = 0; i < bytes.length; i++) {
      c = (crc ^ bytes[i]) & 0xFF;
      for (let k = 0; k < 8; k++) c = c & 1 ? (c >>> 1) ^ 0xEDB88320 : c >>> 1;
      crc = (crc >>> 8) ^ c;
    }
    return (crc ^ 0xFFFFFFFF) >>> 0;
  }

  function makeZip(files) {
    const encoder = new TextEncoder();
    const chunks = [];
    const central = [];
    let offset = 0;

    files.forEach(f => {
      const nameBytes = encoder.encode(f.name);
      const crc = crc32(f.data);
      const size = f.data.length;

      const local = new Uint8Array(30 + nameBytes.length);
      const dv = new DataView(local.buffer);
      dv.setUint32(0, 0x04034b50, true);
      dv.setUint16(4, 20, true);
      dv.setUint16(6, 0, true);
      dv.setUint16(8, 0, true);
      dv.setUint32(14, crc, true);
      dv.setUint32(18, size, true);
      dv.setUint32(22, size, true);
      dv.setUint16(26, nameBytes.length, true);
      local.set(nameBytes, 30);
      chunks.push(local, f.data);

      const cen = new Uint8Array(46 + nameBytes.length);
      const cv = new DataView(cen.buffer);
      cv.setUint32(0, 0x02014b50, true);
      cv.setUint16(4, 20, true);
      cv.setUint16(6, 20, true);
      cv.setUint32(16, crc, true);
      cv.setUint32(20, size, true);
      cv.setUint32(24, size, true);
      cv.setUint16(28, nameBytes.length, true);
      cv.setUint32(42, offset, true);
      cen.set(nameBytes, 46);
      central.push(cen);
      offset += local.length + size;
    });

    const centralSize = central.reduce((a, b) => a + b.length, 0);
    const end = new Uint8Array(22);
    const ev = new DataView(end.buffer);
    ev.setUint32(0, 0x06054b50, true);
    ev.setUint16(8, files.length, true);
    ev.setUint16(10, files.length, true);
    ev.setUint32(12, centralSize, true);
    ev.setUint32(16, offset, true);

    return new Blob([...chunks, ...central, end], { type: 'application/zip' });
  }

  // Project Builder
  document.getElementById('buildBtn').addEventListener('click', () => {
    const name = document.getElementById('appName').value.trim() || 'My App';
    const pkg = document.getElementById('pkgName').value.trim() || 'com.example.myapp';
    const encoder = new TextEncoder();
    const files = [];
    const add = (path, content) => files.push({ name: path, data: encoder.encode(content) });

    // 1. WORKFLOW
    add('.github/workflows/build.yml', `name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: 'temurin', java-version: '17' }
      - uses: android-actions/setup-android@v4.0.4
      - name: Build
        run: |
          cd android
          gradle wrapper --gradle-version 8.4
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
`);

    // 2. GRADLE WRAPPER PROPERTIES
    add('android/gradle/wrapper/gradle-wrapper.properties', `distributionBase=GRADLE_USER_HOME
distributionPath=wrapper/dists
distributionUrl=https\\://services.gradle.org/distributions/gradle-8.4-bin.zip
zipStoreBase=GRADLE_USER_HOME
zipStorePath=wrapper/dists
`);

    // 3. SETTINGS.GRADLE (The missing piece!)
    add('android/settings.gradle', `rootProject.name = "${name.replace(/[^a-zA-Z0-9]/g, '')}"
include ':app'
`);

    // 4. BUILD.GRADLE (Root)
    add('android/build.gradle', `buildscript {
    repositories { google(); mavenCentral() }
    dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
}
allprojects { repositories { google(); mavenCentral() } }
`);

    // 5. GRADLE.PROPERTIES
    add('android/gradle.properties', `android.useAndroidX=true\norg.gradle.jvmargs=-Xmx2048m\n`);

    // 6. APP BUILD.GRADLE
    add('android/app/build.gradle', `plugins { id 'com.android.application' }
android {
    namespace '${pkg}'
    compileSdk 34
    defaultConfig {
        applicationId "${pkg}"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
`);

    // 7. ANDROID MANIFEST
    add('android/app/src/main/AndroidManifest.xml', `<?xml version="1.0" encoding="utf-8"?>
<manifest xmlns:android="http://schemas.android.com/apk/res/android">
    <uses-permission android:name="android.permission.INTERNET"/>
    <application android:label="${name}" android:theme="@style/AppTheme" android:usesCleartextTraffic="true">
        <activity android:name=".MainActivity" android:exported="true">
            <intent-filter>
                <action android:name="android.intent.action.MAIN"/>
                <category android:name="android.intent.category.LAUNCHER"/>
            </intent-filter>
        </activity>
    </application>
</manifest>
`);

    // 8. STYLES.XML
    add('android/app/src/main/res/values/styles.xml', `<?xml version="1.0" encoding="utf-8"?>
<resources>
    <style name="AppTheme" parent="Theme.AppCompat.Light.NoActionBar">
        <item name="colorPrimary">#2b6cb0</item>
    </style>
</resources>
`);

    // 9. MAIN ACTIVITY
    const loadLine = mode === 'url' 
      ? `webView.loadUrl("${document.getElementById('siteUrl').value}");`
      : `webView.loadUrl("file:///android_asset/index.html");`;

    add('android/app/src/main/java/' + pkg.replace(/\./g, '/') + '/MainActivity.java', `package ${pkg};
import android.os.Bundle;
import android.webkit.WebSettings;
import android.webkit.WebView;
import android.webkit.WebViewClient;
import androidx.appcompat.app.AppCompatActivity;

public class MainActivity extends AppCompatActivity {
    private WebView webView;
    @Override
    protected void onCreate(Bundle savedInstanceState) {
        super.onCreate(savedInstanceState);
        webView = new WebView(this);
        setContentView(webView);
        WebSettings s = webView.getSettings();
        s.setJavaScriptEnabled(true);
        s.setDomStorageEnabled(true);
        s.setMediaPlaybackRequiresUserGesture(false);
        webView.setWebViewClient(new WebViewClient());
        ${loadLine}
    }
    @Override
    public void onBackPressed() {
        if (webView.canGoBack()) webView.goBack();
        else super.onBackPressed();
    }
}
`);

    // 10. HTML ASSET
    if (mode === 'html') {
      add('android/app/src/main/assets/index.html', document.getElementById('htmlContent').value);
    }

    // 11. README
    add('README.md', `# ${name}\n\nBuilt via WebToApp.\n\nGo to the Actions tab to download your APK.`);

    // Generate and download
    const blob = makeZip(files);
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'android-project.zip';
    a.click();
  });
})();
</script>
</body>
</html>
